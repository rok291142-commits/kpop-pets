<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff7ac0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>K-Pop Питомцы</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:"Nunito","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:#4a1f7a;
  background:linear-gradient(160deg,#ffc6e6 0%,#e7c9ff 55%,#c9b3ff 100%)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block;width:100%;height:100%;overflow:visible}

/* ---------- блёстки ---------- */
#sparkles{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:40}
.spk{position:absolute;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}

/* ---------- экраны ---------- */
.screen{position:fixed;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 16px 12px}
.screen.active{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.top{flex:none;display:flex;align-items:center;gap:14px;min-height:clamp(56px,11vmin,90px);padding-right:130px}
h1,h2{margin:0;font-weight:900;color:#fff;letter-spacing:.5px}
h2{font-size:clamp(22px,5.4vmin,46px);text-shadow:0 3px 0 #e0559f,0 6px 0 #9b5cff,0 10px 16px rgba(80,20,120,.3)}
.hint{margin-left:auto;font-weight:900;font-size:clamp(14px,2.8vmin,24px);background:#fff;color:#e0306f;
  padding:.3em .9em;border-radius:999px;box-shadow:0 4px 0 rgba(155,92,255,.35);white-space:nowrap}

.rbtn{flex:none;width:clamp(50px,9vmin,76px);height:clamp(50px,9vmin,76px);border-radius:50%;background:#fff;color:#c2368a;
  box-shadow:0 5px 0 #e0559f,0 8px 16px rgba(120,40,160,.25);display:flex;align-items:center;justify-content:center;padding:clamp(10px,2vmin,16px)}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #e0559f}
.corner{position:fixed;top:max(10px,env(safe-area-inset-top));right:16px;display:flex;gap:10px;z-index:45}
.corner .rbtn{width:clamp(44px,7.5vmin,60px);height:clamp(44px,7.5vmin,60px)}

.pill{font-weight:900;color:#fff;font-size:clamp(22px,4.6vmin,40px);border-radius:999px;padding:.45em 1.5em;
  background:linear-gradient(180deg,#ff9ad6,#ff4fa8);box-shadow:0 6px 0 #c2368a,0 12px 22px rgba(150,40,120,.3);
  text-shadow:0 2px 0 rgba(160,30,100,.35)}
.pill:active{transform:translateY(5px);box-shadow:0 1px 0 #c2368a}
.pill.ghost{background:linear-gradient(180deg,#fff,#f1e6ff);color:#9b5cff;text-shadow:none;box-shadow:0 6px 0 #c9a7ff,0 12px 22px rgba(150,40,120,.2)}
.lbl{font-weight:900;font-size:clamp(14px,2.8vmin,26px);background:#fff;color:#c2368a;border-radius:999px;
  padding:.15em .8em;box-shadow:0 3px 0 rgba(155,92,255,.3);white-space:nowrap;margin-top:4px}

/* ---------- титул ---------- */
#s-title{align-items:center;justify-content:center;gap:2.5vmin}
.titleHero{display:flex;align-items:flex-end;justify-content:center;gap:2vmin;height:34vmin}
.titleHero>div{height:100%;animation:bob 2.4s ease-in-out infinite}
.titleHero>div:nth-child(1){width:30vmin}
.titleHero>div:nth-child(2){width:28vmin;animation-delay:.4s}
.titleHero>div:nth-child(3){width:30vmin;animation-delay:.8s}
.logo{font-size:clamp(40px,10vmin,96px);text-align:center;line-height:1.05;
  text-shadow:0 4px 0 #ff4fa8,0 8px 0 #9b5cff,0 14px 22px rgba(80,20,120,.35)}
.langs{display:flex;gap:2vmin;margin-top:1vmin}
.lang{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 16px 8px 10px;font-weight:900;
  font-size:clamp(16px,3vmin,26px);color:#9b5cff;box-shadow:0 4px 0 #c9a7ff;border:4px solid transparent}
.lang.on{border-color:#ffd84d;color:#e0306f}
.lang svg{width:clamp(30px,5vmin,44px);height:auto;border-radius:6px}

/* ---------- сетки ---------- */
.grid{flex:1;min-height:0;display:grid;gap:2.2vmin;padding:1vmin 1vmin 1.5vmin}
.avatars{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}
.kennels{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:2.6vmin 2.2vmin;padding-top:3vmin}
.av{display:flex;flex-direction:column;align-items:center;min-height:0;border:5px solid #fff;border-radius:28px;padding:2% 2% 1.5%;
  background:linear-gradient(180deg,#fff 0%,var(--bg) 70%);box-shadow:0 6px 0 rgba(155,92,255,.35),0 12px 24px rgba(120,40,160,.18);
  transition:transform .15s}
.av:active{transform:scale(.96)}
.av.picked{transform:scale(1.06);box-shadow:0 0 0 7px #ffd84d,0 12px 24px rgba(120,40,160,.25)}
.av .pic{flex:1;min-height:0;width:100%}
.av .pic svg,.me svg{animation:bob 2.6s ease-in-out infinite}
.av:nth-child(2n) .pic svg{animation-delay:.5s}
.av:nth-child(3n) .pic svg{animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- карта ---------- */
.mapRow{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-around;gap:2vmin;padding-bottom:2vmin}
.building{flex:1;max-width:40vw;height:85%;display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.building:active{transform:scale(.95)}
.building .bpic{flex:1;min-height:0;width:100%}
.building .lbl{font-size:clamp(18px,3.6vmin,32px)}
.me{width:22vmin;height:44vmin;flex:none}

/* ---------- приют собак ---------- */
.dogsBg{background:repeating-linear-gradient(90deg,#ffd6ec 0 40px,#ffc8e6 40px 80px)}
.kennel{position:relative;display:flex;flex-direction:column;align-items:center;min-height:0;background:var(--bg);
  border:5px solid #fff;border-radius:46% 46% 22px 22px / 26% 26% 22px 22px;padding:9% 4% 4%;
  box-shadow:0 6px 0 rgba(155,92,255,.35),0 12px 22px rgba(120,40,160,.18);transition:transform .15s}
.kennel:active{transform:scale(.95)}
.kennel::before{content:"";position:absolute;left:12%;right:12%;bottom:15%;height:16%;border-radius:50%;background:rgba(255,255,255,.7)}
.kpic{position:relative;flex:1;min-height:0;width:100%}
.barking .kpic svg,.mpic.barking svg{animation:hop .34s ease 2}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-10%) scale(1.04,.97)}}
.tongue{opacity:0;transition:opacity .1s}
.barking .tongue{opacity:1}
.tail{animation:wag .32s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.bubble{position:absolute;top:-6%;left:50%;transform:translate(-50%,0) scale(0);background:#fff;color:#ff3d9a;font-weight:900;
  font-size:clamp(15px,3.2vmin,28px);padding:.15em .6em;border-radius:18px;box-shadow:0 4px 10px rgba(120,40,160,.25);
  transition:transform .18s;z-index:5;pointer-events:none;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.show{transform:translate(-50%,0) scale(1)}

/* ---------- приют кошек ---------- */
.catsBg{background:repeating-linear-gradient(0deg,#eadcff 0 40px,#e1d0ff 40px 80px)}
.room{position:relative;flex:1;min-height:0;border:5px solid #fff;border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,#f3e9ff 0%,#e9dcff 44%,#ffb7da 44%,#ff9fcf 100%);box-shadow:0 6px 0 rgba(155,92,255,.35)}
.room .deco{position:absolute;pointer-events:none}
.cat{position:absolute;width:clamp(110px,21vmin,210px);height:clamp(88px,16.8vmin,168px);transform:translateX(-50%)}
.cat .flip{width:100%;height:100%}
.cat .bubble{top:-18%}
.leg{animation:none}
.walking .legA{animation:step .38s ease-in-out infinite alternate}
.walking .legB{animation:step .38s ease-in-out infinite alternate-reverse}
@keyframes step{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.walking svg{animation:walkbob .38s ease-in-out infinite alternate}
@keyframes walkbob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.ctail{animation:sway 1.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}

/* ---------- окно "взять?" ---------- */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(74,31,122,.45);display:none;align-items:center;justify-content:center;z-index:500;padding:16px}
.modal.show{display:flex}
.sheet{background:linear-gradient(180deg,#fff,#ffe6f5);border:6px solid #fff;border-radius:34px;padding:2vmin 4vmin 3vmin;
  width:min(92vw,640px);text-align:center;box-shadow:0 14px 40px rgba(80,20,120,.4);animation:popS .25s ease}
@keyframes popS{from{transform:scale(.85)}to{transform:scale(1)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.mpic{height:min(40vh,300px)}
.mname{font-weight:900;font-size:clamp(22px,4.6vmin,40px);color:#e0306f}
.mq{font-weight:900;font-size:clamp(18px,3.6vmin,32px);margin:.3em 0 .8em}
.row{display:flex;gap:3vmin;justify-content:center;align-items:center;flex-wrap:wrap}

/* ---------- имя ---------- */
.nameWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4vmin}
.bigpet{flex:1;max-width:46vw;height:80%;min-height:0}
.bigpet svg{animation:bob 1.8s ease-in-out infinite}
.namePanel{flex:1;max-width:520px;display:flex;flex-direction:column;gap:2.4vmin;align-items:stretch}
#nameInput{font:inherit;font-weight:900;font-size:clamp(24px,5vmin,42px);color:#c2368a;text-align:center;border:5px solid #fff;
  border-radius:24px;padding:.3em .5em;background:#fff8fc;outline:none;box-shadow:0 5px 0 #c9a7ff;user-select:text;-webkit-user-select:text}
#nameInput:focus{border-color:#ffd84d}
.chips{display:flex;flex-wrap:wrap;gap:1.4vmin;justify-content:center}
.chip{font-weight:900;font-size:clamp(15px,2.8vmin,24px);background:#fff;color:#9b5cff;border-radius:999px;padding:.25em .8em;box-shadow:0 4px 0 #c9a7ff}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a7ff}

/* ---------- финал ---------- */
#s-final{align-items:center;justify-content:center;gap:2vmin;text-align:center}
.finalWrap{display:flex;align-items:flex-end;justify-content:center;gap:2vmin;height:48vh}
.fAv{width:26vmin;height:100%}
.fPet{width:40vmin;height:70%}
.fHeart{width:12vmin;height:12vmin;align-self:center;animation:beat .9s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.soon{margin:0;font-weight:900;font-size:clamp(16px,3.2vmin,28px);color:#9b5cff;background:#fff;padding:.3em 1em;border-radius:999px}
.conf{position:fixed;top:-30px;width:20px;height:20px;z-index:60;pointer-events:none;animation:fall linear forwards;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes fall{to{transform:translateY(112vh) rotate(600deg)}}

/* ---------- дом ---------- */
.homeBg{background:repeating-linear-gradient(90deg,#ffe0f1 0 40px,#ffd3ea 40px 80px)}
.hearts{display:flex;gap:4px}
.hearts svg{width:clamp(24px,4.6vmin,38px);height:auto}
.hearts.bump{animation:beat .45s}
.money{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:.15em .8em .15em .25em;
  font-weight:900;font-size:clamp(18px,3.8vmin,32px);color:#c2368a;box-shadow:0 4px 0 #ffd84d;white-space:nowrap}
.money svg{width:1.4em;height:1.4em}
.money.bump{animation:beat .35s}
.houseWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.house{position:relative;isolation:isolate;flex:none;border:5px solid #fff;border-radius:26px;overflow:hidden;touch-action:none;
  background:linear-gradient(90deg,#e6d6ff 0 30%,#ffd6ec 30% 68%,#d2f0ff 68% 100%);box-shadow:0 6px 0 rgba(155,92,255,.35),0 12px 24px rgba(120,40,160,.18)}
.house .floor{position:absolute;left:0;right:32%;bottom:0;height:38%;border-top:6px solid #fff;
  background:repeating-linear-gradient(90deg,#f7b3d4 0 5%,#f2a5ca 5% 10%)}
.house .floor2{position:absolute;left:68%;right:0;bottom:0;height:38%;border-top:6px solid #fff;
  background:repeating-conic-gradient(#bfe8ff 0 25%,#e9f8ff 0 50%) 0 0/28px 28px}
.house .wl{position:absolute;top:0;bottom:38%;width:1.4%;margin-left:-.7%;background:#fff}
.it{position:absolute;transform:translateX(-50%)}
.it svg,.ent .flip svg,.wish svg,.fx svg,.ball svg{height:auto}
.it:not(.tap){pointer-events:none}
.tap:active svg{transform:scale(.95)}
.wig svg{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.eat .food,.eat .water{transform-box:fill-box;transform-origin:center bottom;animation:eatDown 2.4s forwards}
@keyframes eatDown{to{transform:scale(.15);opacity:0}}
.ent{position:absolute;transform:translateX(-50%)}
.ent .bubble{top:-14%}
.walking .flip svg{animation:walkbob .32s ease-in-out infinite alternate}
.wish{position:absolute;left:50%;bottom:86%;width:66%;min-width:58px;transform:translateX(-50%) scale(0);transform-origin:50% 100%;
  transition:transform .3s cubic-bezier(.3,1.6,.6,1);pointer-events:none;z-index:5}
.wish.show{transform:translateX(-50%) scale(1)}
.wish.show svg{animation:bob 1.6s ease-in-out infinite}
.eating .flip svg{transform-origin:30% 100%;animation:nod .26s ease-in-out infinite alternate}
@keyframes nod{to{transform:rotate(-7deg) translateY(2px)}}
.sleeping .blink{animation:none;transform:scaleY(.12)}
.sleeping .tail,.sleeping .ctail{animation:none}
.hop .flip svg{animation:hop .34s ease 2}
.no .flip svg{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hint2{position:absolute;top:3%;left:50%;transform:translateX(-50%);z-index:300;background:#fff;color:#e0306f;font-weight:900;
  font-size:clamp(14px,3vmin,26px);padding:.25em 1em;border-radius:999px;box-shadow:0 4px 0 rgba(155,92,255,.35);
  white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hint2.pop{animation:pop .3s ease}
.night{position:absolute;top:0;left:0;right:0;bottom:0;background:#2a1050;opacity:0;transition:opacity 1s;z-index:150;pointer-events:none}
.night.on{opacity:.38}
.foam{position:absolute;z-index:215;opacity:0;transition:opacity .5s;pointer-events:none}
.foam.on{opacity:1}
.fx{position:absolute;pointer-events:none;z-index:260;animation:floatUp var(--d,1.6s) ease-out forwards}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx,0px)),calc(var(--up,120px) * -1)) scale(1.15);opacity:0}}
.fx.bub{border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 30% 30%,#fff,rgba(190,230,255,.6))}
.fx.zz{font-weight:900;color:#fff;text-shadow:0 2px 0 #9b5cff;font-size:clamp(18px,4vmin,34px)}
.fx.plus{font-weight:900;color:#ffb800;text-shadow:0 2px 0 #fff,0 0 6px #fff;font-size:clamp(18px,4vmin,34px);white-space:nowrap}
.ball{position:absolute;width:4%;z-index:250;opacity:0;pointer-events:none;transform:translate(-50%,50%)}
.ball svg{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.coinfly{position:fixed;left:0;top:0;width:34px;height:34px;z-index:70;pointer-events:none}
.it.pl{pointer-events:auto}
.bagBtn{position:relative}
.badge{position:absolute;top:-8px;right:-8px;min-width:1.6em;background:#ff4fa8;color:#fff;font-weight:900;border-radius:999px;
  padding:.05em .45em;font-size:clamp(12px,2.3vmin,18px);border:3px solid #fff;text-align:center;line-height:1.3}
.badge.ok{background:#3fbf8f;font-size:clamp(11px,2vmin,15px)}
.bagZone{position:absolute;right:1.5%;bottom:3%;width:10%;height:20%;z-index:400;background:rgba(255,255,255,.85);border:4px dashed #ff7ac0;
  border-radius:20px;display:none;align-items:center;justify-content:center;padding:1.2%;pointer-events:none;transition:transform .15s}
.bagZone.show{display:flex}
.bagZone.hot{background:#ffe0f1;transform:scale(1.15)}

/* ---------- магазины ---------- */
.shopP{background:repeating-linear-gradient(90deg,#d4f7e6 0 40px,#c4f0dc 40px 80px);--aw:#ff7ac0}
.shopS{background:radial-gradient(circle at 20% 10%,#7b4ee0,#3b1d78 75%);--aw:#ffd84d}
.awning{flex:none;height:clamp(22px,5vmin,40px);margin:0 -16px;border-radius:0 0 40% 40% / 0 0 100% 100%;
  background:repeating-linear-gradient(90deg,var(--aw) 0 clamp(30px,7vmin,60px),#fff clamp(30px,7vmin,60px) clamp(60px,14vmin,120px));box-shadow:0 5px 0 rgba(0,0,0,.08)}
.tabs{flex:none;display:flex;gap:2vmin;justify-content:center;margin:1.8vmin 0;flex-wrap:wrap}
.tab{font-weight:900;font-size:clamp(15px,3vmin,26px);background:#fff;color:#9b5cff;border-radius:999px;padding:.3em 1em;box-shadow:0 4px 0 #c9a7ff}
.tab.on{background:linear-gradient(180deg,#ff9ad6,#ff4fa8);color:#fff;box-shadow:0 4px 0 #c2368a}
.shopGrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:2vmin;padding:0 1vmin 1.5vmin}
.scard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:24px;
  padding:1.2vmin;box-shadow:0 6px 0 rgba(155,92,255,.3);min-height:0;transition:transform .12s}
.scard:active{transform:scale(.95)}
.shopS .scard{background:#f6efff;box-shadow:0 6px 0 #ffd84d}
.sic{flex:1;min-height:0;width:80%}
.snm{font-weight:900;font-size:clamp(13px,2.6vmin,22px);color:#4a1f7a;text-align:center;line-height:1.15}
.spr{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:#c2368a;font-size:clamp(13px,2.6vmin,22px);background:#fff4c2;
  border-radius:999px;padding:.1em .6em .1em .2em;margin-top:3px;white-space:nowrap}
.spr svg{width:1.3em;height:1.3em}
.spr.big{font-size:clamp(20px,4.4vmin,36px)}
.own{position:absolute;top:8px;right:10px;background:#3fbf8f;color:#fff;font-weight:900;border-radius:50%;width:1.7em;height:1.7em;
  display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.4vmin,20px)}
.buyPic{height:min(30vh,220px)}
.shopPick{gap:4vmin}
.shopBtn{width:min(36vw,250px);display:flex;flex-direction:column;align-items:center;transition:transform .12s}
.shopBtn:active{transform:scale(.95)}
.shopBtn svg{height:auto}
.bagHead{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:clamp(22px,4.6vmin,40px);color:#e0306f}
.bagHead svg{width:1.6em;height:1.6em}
.mq.small{font-size:clamp(15px,3vmin,24px);margin:.2em 0 .6em}
.bagGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(84px,15vmin,120px),1fr));gap:2vmin;max-height:52vh;overflow-y:auto;overflow-x:hidden;
  padding:10px 6px;touch-action:pan-y}
.bcard{position:relative;background:#fff;border-radius:18px;padding:8px 6px;box-shadow:0 4px 0 #c9a7ff;display:flex;flex-direction:column;align-items:center}
.bcard .sic{width:85%;height:clamp(50px,10vmin,80px);flex:none}
.bcard.on{box-shadow:0 0 0 4px #3fbf8f}
#toast{position:fixed;left:50%;bottom:5vh;transform:translate(-50%,180%);background:#fff;color:#c2368a;font-weight:900;font-size:clamp(16px,3.4vmin,28px);
  padding:.5em 1.2em;border-radius:24px;box-shadow:0 6px 0 #ffd84d,0 12px 30px rgba(80,20,120,.3);z-index:600;transition:transform .3s,opacity .3s;opacity:0;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- город ---------- */
.cityBg{background:repeating-linear-gradient(90deg,#e9dcff 0 40px,#e1d0ff 40px 80px)}
.cityWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.city{position:relative;isolation:isolate;flex:none;border:5px solid #fff;border-radius:26px;overflow:hidden;touch-action:none;background:#ffeaf5;
  box-shadow:0 6px 0 rgba(155,92,255,.35),0 12px 24px rgba(120,40,160,.18)}
.cbg{position:absolute;top:0;left:0;width:100%;height:100%}
.cobj{position:absolute;transform:translate(-50%,-100%)}
.cobj svg{height:auto}
.cobj.hide{display:none}
.cbld:active svg{transform:scale(.96)}
.clbl{position:absolute;left:50%;top:-12%;transform:translateX(-50%);font-size:clamp(9px,1.7vmin,15px);padding:.1em .6em;margin:0;pointer-events:none}
.chit{position:absolute;z-index:1}
.cspk{position:absolute;width:2.2%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;animation:twinkle 2.6s ease-in-out infinite;will-change:transform,opacity}
.veh.walking .flip svg{animation:walkbob .2s ease-in-out infinite alternate}
#petBtn.off{opacity:.4}
.destGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(100px,17vmin,140px),1fr));gap:2vmin;max-height:56vh;overflow-y:auto;padding:6px;touch-action:pan-y}
.destGrid .shopBtn{width:auto}
.destGrid .lbl{font-size:clamp(11px,2.2vmin,18px)}

/* ---------- Schritt 5 ---------- */
#homeName{max-width:18vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tint{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0;background:#2a1460;transition:opacity 1s}
.lglow{position:absolute;pointer-events:none;opacity:0;border-radius:50%;transition:opacity 1s;
  background:radial-gradient(circle,rgba(255,246,190,.95) 0,rgba(255,220,120,.45) 35%,rgba(255,220,120,0) 70%)}
.house .lglow,.park .lglow{width:12%;height:22%;transform:translate(-50%,50%);z-index:295}
.city .lglow{width:5%;height:9%;transform:translate(-50%,-50%);z-index:2600}
.sick .flip svg{filter:saturate(.45) brightness(.97)}
.cwish{position:absolute;left:50%;bottom:92%;width:80%;transform:translateX(-50%)}
.cwish svg{height:auto}
.vetBg{background:repeating-linear-gradient(90deg,#d4f4ff 0 40px,#c6eeff 40px 80px)}
.vetScene{position:relative;flex:1;max-width:52vw;height:78%;min-height:0}
.vetScene .vDoc{position:absolute;left:0;bottom:0;height:88%;width:34%}
.vetScene .vDoc svg{height:100%}
.vetScene .vTable{position:absolute;right:0;bottom:0;width:66%;height:46%}
.vetScene .vTable svg{height:100%}
.vetScene .vPet{position:absolute;right:8%;bottom:40%;width:56%}
.vetScene .vPet svg{height:auto}
.vetMsg{font-size:clamp(18px,3.6vmin,30px);background:#fff;border-radius:24px;padding:.6em .9em;box-shadow:0 5px 0 #c9a7ff}
.parkBg{background:repeating-linear-gradient(90deg,#d4f7e6 0 40px,#c4f0dc 40px 80px)}
.park{position:relative;isolation:isolate;flex:none;border:5px solid #fff;border-radius:26px;overflow:hidden;touch-action:none;background:#b8f0cf;
  box-shadow:0 6px 0 rgba(155,92,255,.35),0 12px 24px rgba(120,40,160,.18)}
.park .pbg{position:absolute;top:0;left:0;width:100%;height:100%}
.gameBg{background:linear-gradient(180deg,#bfe8ff,#ffd6ec)}
.timeBar{flex:none;height:14px;margin:0 1vmin 1.5vmin;background:#fff;border-radius:999px;overflow:hidden;box-shadow:0 3px 0 #c9a7ff}
#timeFill{height:100%;width:100%;background:linear-gradient(90deg,#ff9ad6,#ffd84d)}
.gameArea{position:relative;flex:1;min-height:0;border:5px solid #fff;border-radius:26px;overflow:hidden;touch-action:none;
  background:linear-gradient(180deg,#9fdcff 0%,#d9f2ff 62%,#b8f0cf 62%,#9ee6bd 100%)}
.gameArea .gItem{position:absolute;width:7%;transform:translate(-50%,-50%);pointer-events:none}
.gameArea .gItem svg,.gameArea .ent .flip svg{height:auto}
.gameArea .cloud{position:absolute;pointer-events:none;opacity:.9}
.albumGrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(110px,18vmin,170px),1fr));
  gap:3vmin;padding:2vmin;align-content:start;touch-action:pan-y}
.albumGrid .photo{filter:drop-shadow(0 5px 6px rgba(120,40,160,.25));transition:transform .15s}
.albumGrid .photo:nth-child(odd){transform:rotate(-3deg)}
.albumGrid .photo:nth-child(even){transform:rotate(2.5deg)}
.albumGrid .photo svg{height:auto}
.albumEmpty{grid-column:1/-1;text-align:center;font-weight:900;font-size:clamp(18px,3.6vmin,30px);color:#9b5cff;background:#fff;border-radius:24px;padding:1em}
.bigPhoto{height:min(52vh,420px)}
#flash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:700;transition:opacity .5s}
#flash.on{opacity:1;transition:none}

@media (orientation:portrait){
  .avatars{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
  .kennels{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}
  .mapRow{flex-direction:column}
  .building{max-width:none;width:70vw;height:auto;flex:1}
  .me{height:24vh}
  .nameWrap{flex-direction:column}
  .bigpet{max-width:none;width:70vw;height:34vh;flex:none}
  .top{flex-wrap:wrap}
  .hint{margin-left:0}
  .shopGrid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:minmax(150px,1fr);overflow-y:auto}
}

let UID = 0;
function shade(hex, p){
  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0,Math.min(255,Math.round(p<0 ? v*(1+p) : v+(255-v)*p)));
  return '#'+((1<<24)|(f(n>>16)<<16)|(f((n>>8)&255)<<8)|f(n&255)).toString(16).slice(1);
}
function star(cx,cy,r,fill,extra){
  const p=[];
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r;
    p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}
  return `<polygon points="${p.join(' ')}" fill="${fill}" stroke-linejoin="round" ${extra||''}/>`;
}
function heart(cx,cy,s,fill){
  return `<path transform="translate(${cx} ${cy}) scale(${s})" d="M0,6 C-8,0 -9,-6 -5,-8 C-2,-9 0,-7 0,-5 C0,-7 2,-9 5,-8 C9,-6 8,0 0,6Z" fill="${fill}"/>`;
}

function dog(o,wear){

  const cx=124, cy=G-leg-ry, hx=cx-len+4, hy=cy-34, hr=32;
  const c=o.c, c2=o.c2||c, dk=shade(c,-.16), st=o.stroke?` stroke="${o.stroke}" stroke-width="2.5"`:'';
  const id='d'+(++UID);
  let s=`<ellipse cx="${cx-8}" cy="${G+3}" rx="${len+34}" ry="7" fill="#6a2d8f" opacity=".14"/>`;
  // хвост
  const tx=cx+len-8, ty=cy-8, tc=o.tailC||c;
  let tl='';
  if(o.tail==='up')    tl=`<path d="M${tx},${ty} Q${tx+24},${ty-4} ${tx+28},${ty-34}" stroke="${tc}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  if(o.tail==='stub')  tl=`<ellipse cx="${tx+10}" cy="${ty-2}" rx="12" ry="9" fill="${tc}"${st}/>`;
  if(o.tail==='curl')  tl=`<path d="M${tx},${ty} C${tx+22},${ty-2} ${tx+26},${ty-30} ${tx+10},${ty-30} C${tx},${ty-30} ${tx},${ty-18} ${tx+10},${ty-18}" stroke="${tc}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  if(o.tail==='pom')   tl=`<path d="M${tx},${ty} L${tx+18},${ty-26}" stroke="${tc}" stroke-width="6" stroke-linecap="round"/><circle cx="${tx+20}" cy="${ty-30}" r="12" fill="${tc}"${st}/>`;
  if(o.tail==='fluff') tl=`<circle cx="${tx+8}" cy="${ty-12}" r="15" fill="${tc}"${st}/><circle cx="${tx+20}" cy="${ty-24}" r="13" fill="${tc}"${st}/><circle cx="${tx+10}" cy="${ty-34}" r="11" fill="${o.tailTip||tc}"${st}/>`;
  s+=`<g class="tail" style="transform-origin:${tx}px ${ty}px">${tl}</g>`;
  // лапы
  const lx=[cx-len+16, cx-len+34, cx+len-34, cx+len-16], lt=cy+ry*.4, lh=G-lt;

    s+=`<clipPath id="${id}b"><ellipse cx="${cx}" cy="${cy}" rx="${len}" ry="${ry}"/></clipPath><g clip-path="url(#${id}b)" fill="#2b2430">`+
      [[-24,-10,6],[0,6,7],[22,-12,5],[36,10,6],[-8,-20,4],[14,18,4],[-34,8,5]].map(([a,b,r])=>`<circle cx="${cx+a}" cy="${cy+b}" r="${r}"/>`).join('')+'</g>';
    s+=`<circle cx="${lx[0]}" cy="${lt+lh*.55}" r="3.5" fill="#2b2430"/><circle cx="${lx[2]}" cy="${lt+lh*.4}" r="3" fill="#2b2430"/>`;
  }
  const geo={hx,hy,hr,ex:12,ey:hy-4,cx,cy,len,ry};
  if(wear&&wear.body) s+=wearBody(wear.body,geo,id);
  // уши, которые стоят (рисуем до головы)
  const ec=o.earC||c;

    for(const sd of [-1,1]){

  if(o.pug) s+=`<path d="M${hx-11},${hy-20} Q${hx},${hy-25} ${hx+11},${hy-20} M${hx-8},${hy-14} Q${hx},${hy-18} ${hx+8},${hy-14}" stroke="${shade(c,-.3)}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(o.poodle){ s+=`<circle cx="${hx-14}" cy="${hy-28}" r="13" fill="${c}"${st}/><circle cx="${hx+14}" cy="${hy-28}" r="13" fill="${c}"${st}/><circle cx="${hx}" cy="${hy-35}" r="14" fill="${c}"${st}/><circle cx="${hx}" cy="${hy-24}" r="12" fill="${c}"/>`;

  // мордочка
  s+=`<ellipse cx="${hx}" cy="${hy+13}" rx="${o.pug?20:17}" ry="13" fill="${o.pug?'#3a2a30':(o.muzzle||c2)}"/>`;
  s+=`<g class="blink">`;
  for(const x of [hx-12,hx+12]){
    if(o.eye) s+=`<circle cx="${x}" cy="${hy-4}" r="6.5" fill="${o.eye}"/><circle cx="${x}" cy="${hy-4}" r="3.5" fill="#1a1020"/>`;

let AC=null, master=null, noiseBuf=null, muted=false;
function ac(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    AC=new C(); master=AC.createGain(); master.gain.value=muted?0:.8; master.connect(AC.destination);
    setTimeout(startMusic,0);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function env(g,t,a,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);}
function woof(t,p){
  const a=AC, o=a.createOscillator(), f=a.createBiquadFilter(), g=a.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(330*p,t); o.frequency.exponentialRampToValueAtTime(140*p,t+.14);
  f.type='lowpass'; f.Q.value=4; f.frequency.setValueAtTime(1900*p,t); f.frequency.exponentialRampToValueAtTime(500*p,t+.15);
  env(g,t,.012,.55,.17); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+.2);
  const n=a.createBufferSource(), nf=a.createBiquadFilter(), ng=a.createGain();
  n.buffer=noiseBuf; nf.type='bandpass'; nf.frequency.value=1200*p; nf.Q.value=1.2;
  env(ng,t,.005,.35,.07); n.connect(nf); nf.connect(ng); ng.connect(master); n.start(t); n.stop(t+.1);
}
function bark(p){ if(!ac()) return; const t=AC.currentTime+.01; woof(t,p); woof(t+.2,p*1.05); }
function meow(p){
  if(!ac()) return;
  const a=AC, t=a.currentTime+.01, d=.7;
  const o=a.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(520*p,t); o.frequency.linearRampToValueAtTime(820*p,t+.22);
  o.frequency.linearRampToValueAtTime(600*p,t+.5); o.frequency.linearRampToValueAtTime(420*p,t+d);
  const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=7; lg.gain.value=12*p; lfo.connect(lg); lg.connect(o.frequency);
  const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=4;
  f.frequency.setValueAtTime(700*p,t); f.frequency.linearRampToValueAtTime(1900*p,t+.22); f.frequency.linearRampToValueAtTime(900*p,t+d);
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500; const lpg=a.createGain(); lpg.gain.value=.15;
  const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.9,t+.06); g.gain.setValueAtTime(.9,t+.45); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(f); f.connect(g); o.connect(lp); lp.connect(lpg); lpg.connect(g); g.connect(master);
  o.start(t); o.stop(t+d+.05); lfo.start(t); lfo.stop(t+d+.05);
}
function tone(freq,t,dur,type,vol){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'triangle'; o.frequency.value=freq;

const $ = id => document.getElementById(id);

  cons:{food:0,water:0,treat:0,shampoo:0}, items:null, clothes:[], wear:{head:null,eyes:null,body:null,neck:null}, nextU:10, lastPlace:'home', petCity:true, sick:false, cares:0, clock:.1, photos:[]};
let current='s-title', timers=[];
function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
const tn = k => t(k).replace(/\{name\}/g, state.name);
function save(){
  try{ localStorage.setItem('kpopPets', JSON.stringify({lang, avatar:state.avatar, pet:state.pet, name:state.name,
       money:state.money, happy:state.happy, lastSeen:Date.now(),
       cons:state.cons, items:state.items, clothes:state.clothes, wear:state.wear, nextU:state.nextU, lastPlace:state.lastPlace, petCity:state.petCity, sick:state.sick, cares:state.cares, clock:state.clock, photos:state.photos, muted:muted})); }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('kpopPets')||'null'); if(!d) return;
    if(T[d.lang]) lang=d.lang;
    if(d.avatar>=0 && d.avatar<AVATARS.length) state.avatar=d.avatar|0;
    const p=d.pet;
    if(p && ((p.type==='dog' && p.i>=0 && p.i<DOGS.length) || (p.type==='cat' && p.i>=0 && p.i<CATS.length)) && typeof d.name==='string' && d.name){
      state.pet={type:p.type,i:p.i|0}; state.name=d.name.slice(0,14);
    }
    if(typeof d.money==='number' && isFinite(d.money) && d.money>=0) state.money=Math.floor(d.money);
    if(typeof d.happy==='number' && isFinite(d.happy)) state.happy=Math.max(0,Math.min(100,d.happy));
    if(d.lastSeen){ const hours=(Date.now()-d.lastSeen)/36e5; if(hours>0) state.happy=Math.max(0,state.happy-Math.min(40,Math.floor(hours*4))); }
    if(d.cons) for(const k in state.cons){ const n=d.cons[k]; if(Number.isInteger(n) && n>=0) state.cons[k]=n; }
    if(Array.isArray(d.items)){
      const num=v=>typeof v==='number'&&isFinite(v);
      state.items=d.items.filter(i=>i && CATALOG[i.id] && CATALOG[i.id].t==='place' && Number.isInteger(i.u) &&
        ((i.x===null && i.y===null) || (num(i.x) && num(i.y))))
        .map(i=>({u:i.u,id:i.id,x:i.x===null?null:Math.max(0,Math.min(1,i.x)),y:i.y===null?null:Math.max(0,Math.min(1,i.y))}));
    }
    if(Array.isArray(d.clothes)) state.clothes=[...new Set(d.clothes.filter(id=>CATALOG[id] && CATALOG[id].t==='wear'))];
    if(d.wear) for(const k in state.wear){ const id=d.wear[k]; if(id && state.clothes.includes(id) && CATALOG[id].slot===k) state.wear[k]=id; }
    if(Number.isInteger(d.nextU)) state.nextU=d.nextU;
    if(['home','dogs','cats','shopP','shopS','vet','park'].includes(d.lastPlace)) state.lastPlace=d.lastPlace;
    if(d.sick===true && state.pet) state.sick=true;
    if(Number.isInteger(d.cares) && d.cares>=0) state.cares=d.cares;
    if(typeof d.clock==='number' && d.clock>=0 && d.clock<1) state.clock=d.clock;
    if(d.muted===true) muted=true;
    if(Array.isArray(d.photos)) state.photos=d.photos.filter(ph=>ph && ph.p && ((ph.p.type==='dog'&&ph.p.i>=0&&ph.p.i<DOGS.length)||(ph.p.type==='cat'&&ph.p.i>=0&&ph.p.i<CATS.length))
        && typeof ph.n==='string' && typeof ph.ts==='number').slice(-40).map(ph=>({p:{type:ph.p.type,i:ph.p.i|0},
        w:Object.fromEntries(['head','eyes','body','neck'].map(k=>[k, ph.w && CATALOG[ph.w[k]] && CATALOG[ph.w[k]].slot===k ? ph.w[k] : null])),
        n:ph.n.slice(0,14), pl:['home','park','city'].includes(ph.pl)?ph.pl:'home', d:!!ph.d, ts:ph.ts}));
    if(d.petCity===false) state.petCity=false;
  }catch(e){}
}
function ensureItems(){
  if(!Array.isArray(state.items)) state.items=DEFAULT_ITEMS();
  state.nextU=Math.max(state.nextU, ...state.items.map(i=>i.u+1), 10);
}

}
function goCats(){
  const room=$('room');
  room.innerHTML=roomDeco();
  const lanes=[3,17,31];
  cats=CATS.map((c,i)=>{
    const el=document.createElement('button');
    el.className='cat walking'; el.dataset.i=i;
    const lane=i%3;
    el.style.bottom=lanes[lane]+'%'; el.style.zIndex=10-lane;
    el.innerHTML=`<div class="flip">${cat(c.o)}</div><div class="bubble"></div>`;
    room.appendChild(el);
    return {el, flip:el.firstChild, bubble:el.lastChild, x:10+i*11+Math.random()*4, dir:Math.random()<.5?-1:1,
            speed:7+Math.random()*6, state:'walk', timer:1.5+Math.random()*3, hold:false};
  });
  show('s-cats');
  lastT=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(catLoop);
  CATS.forEach((c,i)=>later(()=>catMeow(i), 400+i*380));
}
function catLoop(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  for(const c of cats){
    if(!c.hold){
      c.timer-=dt;
      if(c.state==='walk'){
        c.x+=c.dir*c.speed*dt;
        if(c.x<9){c.x=9;c.dir=1;} if(c.x>91){c.x=91;c.dir=-1;}
        if(c.timer<=0){c.state='sit';c.timer=1+Math.random()*2.5;c.el.classList.remove('walking');}
      }else if(c.timer<=0){
        c.state='walk';c.timer=2+Math.random()*4; if(Math.random()<.4)c.dir*=-1; c.el.classList.add('walking');
      }
    }
    c.el.style.left=c.x+'%';
    c.flip.style.transform=c.dir>0?'scaleX(-1)':'none';
  }
  raf=requestAnimationFrame(catLoop);
}
function stopCats(){ cancelAnimationFrame(raf); raf=0; }
function catMeow(i){
  const c=cats[i]; if(!c) return;
  c.bubble.textContent=t('meow'); c.bubble.classList.add('show'); meow(CATS[i].p);
  setTimeout(()=>c.bubble.classList.remove('show'),900);
}
$('room').addEventListener('click',e=>{
  const el=e.target.closest('.cat'); if(!el) return;
  const i=+el.dataset.i, c=cats[i];
  c.hold=true; c.el.classList.remove('walking');
  catMeow(i); later(()=>openModal('cat',i),400);
});

const PAL = {p:{main:'#ff7ac0',light:'#ffd6ec',dark:'#e0306f',acc:'#7ee0b8'}, s:{main:'#9b5cff',light:'#e3d4ff',dark:'#5b2bb5',acc:'#ffd84d'}};

/* --- одежда на питомце --- */
function wearBody(id,g,uid){
  const v=PAL[vOf(id)], x=g.cx-g.len*.6, w=g.len*1.1;
  return `<clipPath id="${uid}w"><ellipse cx="${g.cx}" cy="${g.cy}" rx="${g.len}" ry="${g.ry}"/></clipPath><g clip-path="url(#${uid}w)">
    <rect x="${x}" y="${g.cy-g.ry-2}" width="${w}" height="${g.ry*2+4}" fill="${v.main}"/>
    <rect x="${x}" y="${g.cy-2}" width="${w}" height="5" fill="${v.light}"/><rect x="${x}" y="${g.cy+9}" width="${w}" height="5" fill="${v.light}"/></g>`+
    (vOf(id)==='p' ? heart(g.cx-g.len*.05,g.cy-9,1.1,'#fff') : star(g.cx-g.len*.05,g.cy-10,7,'#ffd84d'));
}
function wearNeck(id,g){
  const v=PAL[vOf(id)], y=g.hy+g.hr*.78;
  return `<path d="M${g.hx-g.hr*.68},${y-4} Q${g.hx},${y+g.hr*.32} ${g.hx+g.hr*.68},${y-4}" stroke="${v.main}" stroke-width="6" fill="none" stroke-linecap="round"/>`+
    (vOf(id)==='p' ? heart(g.hx,y+g.hr*.12+6,.8,'#ffd84d') : star(g.hx,y+g.hr*.12+6,6,'#ffd84d'));
}
function wearEyes(id,g){
  const xs=[g.hx-g.ex,g.hx+g.ex], y=g.ey;
  let s=`<path d="M${xs[0]+7},${y-2} Q${g.hx},${y-6} ${xs[1]-7},${y-2} M${xs[0]-9},${y-3} L${g.hx-g.hr*.9},${y-6} M${xs[1]+9},${y-3} L${g.hx+g.hr*.9},${y-6}" stroke="#2b1a3a" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  for(const x of xs) s += vOf(id)==='p'
    ? `<path transform="translate(${x} ${y+1}) scale(1.2)" d="M0,6 C-8,0 -9,-6 -5,-8 C-2,-9 0,-7 0,-5 C0,-7 2,-9 5,-8 C9,-6 8,0 0,6Z" fill="#ff4fa8" fill-opacity=".6" stroke="#e0306f" stroke-width="1.4"/>`
    : star(x,y,10.5,'#ffd84d','fill-opacity=".65" stroke="#5b2bb5" stroke-width="1.6"');
  return s;
}
function wearHead(id,g){
  const v=PAL[vOf(id)], hx=g.hx, top=g.hy-g.hr;
  if(id.startsWith('bow')){
    const bx=hx+g.hr*.55, by=g.hy-g.hr*.78;
    return `<g transform="translate(${bx} ${by}) rotate(15)"><path d="M0,0 L-15,-10 L-15,10Z M0,0 L15,-10 L15,10Z" fill="${v.main}" stroke="${v.dark}" stroke-width="2" stroke-linejoin="round"/><circle r="4.5" fill="${v.dark}"/></g>`;
  }
  const r=g.hr;
  return `<ellipse cx="${hx}" cy="${top+8}" rx="${r*.95}" ry="6" fill="${v.dark}"/>
    <path d="M${hx-r*.55},${top+8} Q${hx-r*.5},${top-16} ${hx},${top-17} Q${hx+r*.5},${top-16} ${hx+r*.55},${top+8}Z" fill="${v.main}"/>
    <rect x="${hx-r*.53}" y="${top+1}" width="${r*1.06}" height="5" fill="${v.light}"/>`+
    (vOf(id)==='p' ? `<g fill="#fff"><circle cx="${hx+r*.32}" cy="${top-1}" r="3.2"/><circle cx="${hx+r*.32+5}" cy="${top+2}" r="3.2"/><circle cx="${hx+r*.32-5}" cy="${top+2}" r="3.2"/><circle cx="${hx+r*.32}" cy="${top+5}" r="3.2"/></g><circle cx="${hx+r*.32}" cy="${top+2}" r="2.4" fill="#ffd84d"/>`
                   : star(hx,top-6,6.5,'#ffd84d'));
}
function wearTop(w,g){
  let s='';
  if(w.neck) s+=wearNeck(w.neck,g);
  if(w.eyes) s+=wearEyes(w.eyes,g);
  if(w.head) s+=wearHead(w.head,g);
  return s;
}

function stepEnt(e,dt,sp,W,H){
  W=W||HM.W; H=H||HM.H;

  const dx=(e.tx-e.x)*W, dy=(e.ty-e.y)*H, d=Math.hypot(dx,dy);

  if(HM.act){
    if(HM.act.phase==='walk' && ((!av.target && !pet.target) || now-HM.act.t0>5000)) startCare();

  }else{

/* =====================================================================
   STADT ERFURT (Schritt 4)   Koordinaten: x 0..180, y 0..100
   ===================================================================== */
const CN={}, CE=[];
function nid(x,y){ const id=x+','+y; if(!CN[id]) CN[id]={id,x,y,adj:[]}; return id; }
function edge(a,b,type){ const e={a:nid(a[0],a[1]),b:nid(b[0],b[1]),type:type||'all'}; CE.push(e); CN[e.a].adj.push(e); CN[e.b].adj.push(e); }
function row(y,xs,tf){ for(let i=0;i<xs.length-1;i++) edge([xs[i],y],[xs[i+1],y],tf?tf(xs[i],xs[i+1]):'all'); }
row(48,[8,30,44,60,90,112,138,150,156,164,174],(a,b)=>a===112&&b===138?'ped':'all');   // Hauptstraße, Krämerbrücke nur zu Fuß
row(86,[8,30,52,60,75,90,101,112,138,156,168,174]);                                      // untere Straße mit Straßenbahn
row(26,[30,60]);                                                                     // Domplatz
edge([8,48],[8,86]); edge([30,26],[30,48],'ped'); edge([60,26],[60,48]); edge([60,48],[60,86]);
edge([90,48],[90,86]); edge([138,48],[138,86]); edge([174,48],[174,86]);
edge([-12,48],[8,48],'veh'); edge([-12,86],[8,86],'veh'); edge([174,48],[192,48],'veh'); edge([174,86],[192,86],'veh');
const SPAWNS=['-12,48','-12,86','192,48','192,86'];
const okE=(e,m)=>e.type==='all'||e.type===m;
const dst=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
function dijkstra(src,m){
  const D={},P={},Q=new Set(Object.keys(CN));
  for(const k in CN) D[k]=Infinity; D[src]=0;
  while(Q.size){
    let u=null; for(const k of Q) if(u===null||D[k]<D[u]) u=k;
    Q.delete(u); if(D[u]===Infinity) break;
    for(const e of CN[u].adj){ if(!okE(e,m)) continue; const v=e.a===u?e.b:e.a, nd=D[u]+dst(CN[u],CN[v]); if(nd<D[v]){ D[v]=nd; P[v]=u; } }
  }
  return {D,P};
}
function project(x,y,m){
  let best=null;
  for(const e of CE){
    if(!okE(e,m)) continue;
    const A=CN[e.a],B=CN[e.b],dx=B.x-A.x,dy=B.y-A.y,L=dx*dx+dy*dy;
    const t=Math.max(0,Math.min(1,L?((x-A.x)*dx+(y-A.y)*dy)/L:0));
    const p={x:A.x+t*dx,y:A.y+t*dy,e}, d=Math.hypot(p.x-x,p.y-y);
    if(!best||d<best.d) best={...p,d};
  }
  return best;
}
function atNode(id,m){ const n=CN[id]; return {x:n.x,y:n.y,e:n.adj.find(e=>okE(e,m))}; }
function route(P,T,m){
  if(P.e===T.e) return [{x:P.x,y:P.y},{x:T.x,y:T.y}];
  let best=null;
  for(const s of [P.e.a,P.e.b]){
    const {D,P:prev}=dijkstra(s,m);
    for(const t of [T.e.a,T.e.b]){
      const c=dst(P,CN[s])+D[t]+dst(CN[t],T);
      if(!best||c<best.c){ const nodes=[]; let k=t; while(k!==undefined){ nodes.unshift(CN[k]); if(k===s) break; k=prev[k]; } best={c,nodes}; }
    }
  }
  return [{x:P.x,y:P.y},...best.nodes.map(n=>({x:n.x,y:n.y})),{x:T.x,y:T.y}];
}

function fachHouse(x,base,w,h,wall,roof,glow){
  const L=x-w/2,R=x+w/2,T=base-h,m=T+h*.5;
  return `<rect x="${L}" y="${T}" width="${w}" height="${h}" fill="${wall}"/>
    <path d="M${L},${m} H${R} M${L+.4},${T} V${base} M${R-.4},${T} V${base} M${x},${m} V${base} M${L},${base} L${x},${m} L${R},${base}" stroke="#9a6a7a" stroke-width=".45" fill="none"/>
    <rect x="${L+w*.14}" y="${T+h*.13}" width="${w*.26}" height="${h*.24}" rx=".4" fill="#fff6b0"${glow?' class="tw"':''}/>
    <rect x="${R-w*.4}" y="${T+h*.13}" width="${w*.26}" height="${h*.24}" rx=".4" fill="#fff6b0"/>
    <polygon points="${L-1},${T+.3} ${x},${T-h*.5} ${R+1},${T+.3}" fill="${roof}" stroke="${roof}" stroke-width=".6" stroke-linejoin="round"/>`;
}

const CT={W:1,H:1,raf:0,last:0,av:null,pet:null,npcs:[],cars:[],vehs:[],busy:null,trail:[]};
function cEnt(html,w,cls){
  const el=document.createElement('div'); el.className='cobj '+(cls||''); el.style.width=(w/1.8)+'%';
  el.innerHTML=`<div class="flip">${html}</div>`; $('city').appendChild(el);
  return {el,flip:el.firstChild,x:0,y:0,path:null,i:0,speed:10,dir:1,done:null,zb:0,wait:0};
}
function cPos(e){ e.el.style.left=(e.x/1.8)+'%'; e.el.style.top=e.y+'%'; e.el.style.zIndex=Math.round(e.y*10)+e.zb; }
function follow(e,path,speed,done){ e.path=path; e.i=0; e.speed=speed; e.done=done||null; e.el.classList.add('walking'); }
function stepPath(e,dt){
  if(!e.path) return;
  let rem=e.speed*dt;
  while(rem>0 && e.i<e.path.length-1){
    const nx=e.path[e.i+1], d=Math.hypot(nx.x-e.x,nx.y-e.y);
    if(Math.abs(nx.x-e.x)>.05) e.dir=nx.x>e.x?1:-1;
    if(d<=rem){ e.x=nx.x; e.y=nx.y; e.i++; rem-=d; } else { e.x+=(nx.x-e.x)/d*rem; e.y+=(nx.y-e.y)/d*rem; rem=0; }
  }
  if(e.i>=e.path.length-1){ e.path=null; e.el.classList.remove('walking'); const cb=e.done; e.done=null; if(cb) cb(); }
}
function fitCity(){
  const r=$('cityWrap').getBoundingClientRect(), A=1.8;
  let w=r.width, h=w/A; if(h>r.height){ h=r.height; w=h*A; }
  $('city').style.width=w+'px'; $('city').style.height=h+'px'; CT.W=w; CT.H=h;
}
function setCityHint(txt){ const h=$('cityHint'); if(!h) return; h.textContent=txt; h.classList.remove('pop'); void h.offsetWidth; h.classList.add('pop'); }

function goCity(from){

  state.lastPlace=from; save();

  const P=PLACES[from]; CT.av.x=P.node[0]; CT.av.y=P.node[1];

function stopCity(){ cancelAnimationFrame(CT.raf); CT.raf=0; CT.busy=null; save(); }
function trailPoint(back){
  let p={x:CT.av.x,y:CT.av.y};
  for(let i=CT.trail.length-1;i>=0;i--){
    const q=CT.trail[i], d=Math.hypot(q.x-p.x,q.y-p.y);
    if(d>=back){ const f=back/d; return {x:p.x+(q.x-p.x)*f, y:p.y+(q.y-p.y)*f}; }
    back-=d; p=q;
  }
  return p;
}
function cityLoop(now){
  const dt=Math.min(.25,(now-CT.last)/1000); CT.last=now;
  const a=CT.av;
  stepPath(a,dt);
  const lt=CT.trail[CT.trail.length-1];
  if(!lt || Math.hypot(a.x-lt.x,a.y-lt.y)>.4){ CT.trail.push({x:a.x,y:a.y}); if(CT.trail.length>120) CT.trail.shift(); }
  if(CT.pet && CT.busy!=='ride'){
    const p=CT.pet, tp=trailPoint(5.5), d=Math.hypot(tp.x-p.x,tp.y-p.y);
    if(d>.05){ const s=Math.min(d,30*dt); if(Math.abs(tp.x-p.x)>.05) p.dir=tp.x>p.x?1:-1; p.x+=(tp.x-p.x)/d*s; p.y+=(tp.y-p.y)/d*s; p.el.classList.add('walking'); }
    else p.el.classList.remove('walking');
    p.flip.style.transform=p.dir>0?'scaleX(-1)':'none'; cPos(p);
  }
  for(const n of CT.npcs){ if(n.path) stepPath(n,dt); else { n.wait-=dt; if(n.wait<=0) npcNext(n); } cPos(n); }
  for(const c of CT.cars){ if(c.path) stepPath(c,dt); else { c.wait-=dt; if(c.wait<=0) carNext(c); } c.flip.style.transform=c.dir<0?'scaleX(-1)':'none'; cPos(c); }
  for(const v of CT.vehs){ stepPath(v,dt); v.flip.style.transform=v.dir<0?'scaleX(-1)':'none'; cPos(v); }
  cPos(a);
  CT.raf=requestAnimationFrame(cityLoop);
}
function cityWalkTo(x,y,done){
  const P=project(CT.av.x,CT.av.y,'ped'), T=project(x,y,'ped');

}
function enterPlace(id){
  if(id==='home' && !state.pet){ toast(t('needPet')); nope(); return; }

    if(!state.pet){ toast(t('needPet')); nope(); return; }
    if(state.petCity===false){ toast(t('bringPet')); nope(); return; }
  }
  if(id==='home') goHome(); else if(id==='dogs') goDogs(); else if(id==='cats') goCats();

}

/* --- Musik: eigene K-Pop-Melodie --- */
const music={on:false,timer:0,step:0,next:0,gain:null};
const MEL=[[0,81,2],[2,84,2],[4,81,1],[5,79,2],[8,77,2],[11,79,1],[12,81,2],[14,84,2],[16,86,3],[20,84,2],[22,83,2],[24,79,4],[28,81,2],[30,83,2],
  [32,84,2],[34,83,2],[36,79,2],[38,76,2],[40,79,3],[44,83,2],[46,84,2],[48,81,4],[52,79,2],[54,76,2],[56,81,6],[62,84,2]];
const MELMAP={}; MEL.forEach(m=>MELMAP[m[0]]=m);
const CHORDS=[[65,69,72],[67,71,74],[64,67,71],[69,72,76]], BASS=[41,43,40,45];
const mf=m=>440*Math.pow(2,(m-69)/12);
function startMusic(){
  if(music.on || !AC) return;
  music.on=true; music.gain=AC.createGain(); music.gain.gain.value=.14; music.gain.connect(master);
  music.next=AC.currentTime+.15; music.step=0; music.timer=setInterval(musicTick,50);
}
function musicTick(){
  if(!AC || AC.state!=='running') { if(AC) music.next=Math.max(music.next,AC.currentTime+.1); return; }
  if(music.next<AC.currentTime) music.next=AC.currentTime+.05;
  while(music.next<AC.currentTime+.25){ playStep(music.step,music.next); music.next+=.125; music.step=(music.step+1)%64; }
}
function mNote(f,t,d,type,vol){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(music.gain); o.start(t); o.stop(t+d+.05);
}
function mNoise(t,type,freq,vol,d){
  const n=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  n.buffer=noiseBuf; f.type=type; f.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  n.connect(f); f.connect(g); g.connect(music.gain); n.start(t); n.stop(t+d+.02);
}
function playStep(s,t){
  const bar=s>>4, st=s&15;
  if(st===0||st===8||(st===10&&bar%2===1)){
    const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.12);
    g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.16); o.connect(g); g.connect(music.gain); o.start(t); o.stop(t+.18);
  }
  if(st===4||st===12) mNoise(t,'bandpass',1500,.45,.14);
  if(st%2===1) mNoise(t,'highpass',7000,st%4===3?.16:.08,.04);
  if(st%2===0) mNote(mf(BASS[bar]+(st%4===2?12:0)),t,.2,'triangle',.5);
  if(st===2||st===6||st===10||st===14) for(const m of CHORDS[bar]) mNote(mf(m),t,.16,'square',.05);
  const m=MELMAP[s];
  if(m){ mNote(mf(m[1]),t,m[2]*.12,'triangle',.3); mNote(mf(m[1]-12),t,m[2]*.12,'square',.04); }
  if(st===15 && bar===3) mNote(mf(96),t,.35,'sine',.12);
}

  if(document.hidden || !WORLD.includes(current)) return;

},1000);

const GM={raf:0,last:0,time:0,items:[],pet:null,px:.5,spawn:0,caught:0,coins:0,from:'home',running:false};
const FISH_I = `<svg viewBox="0 0 100 60"><ellipse cx="44" cy="30" rx="34" ry="20" fill="#ff9f5a"/><path d="M74,30 L98,10 L98,50Z" fill="#ff9f5a"/><circle cx="26" cy="25" r="5" fill="#2b1a3a"/><circle cx="27.5" cy="23.5" r="1.8" fill="#fff"/><path d="M40,16 Q48,30 40,44" stroke="#ffc48a" stroke-width="4" fill="none"/></svg>`;
const STAR_I = `<svg viewBox="0 0 100 100">${star(50,52,46,'#ffd84d','stroke="#fff" stroke-width="5"')}</svg>`;
function goGame(from){
  GM.from=from||'home';
  show('s-game');
  const a=$('gameArea');
  a.innerHTML=[[8,10,16],[60,6,20],[82,18,14]].map(([x,y,w])=>`<div class="cloud" style="left:${x}%;top:${y}%;width:${w}%"><svg viewBox="0 0 100 50"><g fill="#fff"><circle cx="30" cy="30" r="18"/><circle cx="52" cy="22" r="22"/><circle cx="74" cy="32" r="16"/><rect x="20" y="30" width="64" height="18" rx="9"/></g></svg></div>`).join('')+
    `<div class="hint2" id="gameHint" style="z-index:50"></div>`;
  GM.pet=mkEntIn(a,petSvg(state.pet,state.wear),state.pet.type==='dog'?16:15,true);
  GM.pet.y=.02; GM.px=.5; GM.pet.x=.5; GM.items=[]; GM.caught=0; GM.coins=0; GM.time=30; GM.spawn=.6; GM.running=true;
  renderEnt(GM.pet); gameScore();
  const h=$('gameHint'); h.textContent=t('gameHint');
  later(()=>{ h.style.transition='opacity .6s'; h.style.opacity='0'; },3500);
  GM.last=performance.now(); cancelAnimationFrame(GM.raf); GM.raf=requestAnimationFrame(gameLoop);
}
function stopGame(){ cancelAnimationFrame(GM.raf); GM.raf=0; GM.running=false; }
function gameScore(){ $('gameScore').innerHTML=COIN+`<span>+${fmtMoney(GM.coins)}</span>`; $('timeFill').style.width=Math.max(0,GM.time/30*100)+'%'; }
function gameMove(e){
  if(!GM.running) return;
  const r=$('gameArea').getBoundingClientRect(); GM.px=Math.max(.07,Math.min(.93,(e.clientX-r.left)/r.width));
}
$('gameArea').addEventListener('pointerdown',e=>{ ac(); gameMove(e); try{ $('gameArea').setPointerCapture(e.pointerId); }catch(err){} });
$('gameArea').addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') gameMove(e); });
function gameLoop(now){
  const dt=Math.min(.1,(now-GM.last)/1000); GM.last=now;
  if(!GM.running) return;
  GM.time-=dt;
  const p=GM.pet, dx=GM.px-p.x;
  if(Math.abs(dx)>.003){ p.x+=Math.sign(dx)*Math.min(Math.abs(dx),1.4*dt); p.dir=dx>0?1:-1; p.el.classList.add('walking'); } else p.el.classList.remove('walking');
  renderEnt(p);
  GM.spawn-=dt;
  if(GM.spawn<=0 && GM.time>0){
    GM.spawn=Math.max(.35,.8-(30-GM.time)*.012);
    const r=Math.random(), kind=r<.12?'star':'food';
    const el=document.createElement('div'); el.className='gItem';
    el.innerHTML=kind==='star'?STAR_I:(state.pet.type==='cat'?FISH_I:TREAT_I);
    $('gameArea').appendChild(el);
    GM.items.push({el,kind,x:.06+Math.random()*.88,y:-.06,v:.28+Math.random()*.12+(30-GM.time)*.006,rot:Math.random()*360});
  }
  const ar=$('gameArea').getBoundingClientRect(), petTopY=1-(p.el.offsetHeight/ar.height)*.85;
  for(const it of GM.items){
    it.y+=it.v*dt; it.rot+=90*dt;
    if(!it.done && it.y>petTopY && it.y<petTopY+.12 && Math.abs(it.x-p.x)<.08){
      it.done=true; GM.caught++; GM.coins+= it.kind==='star'?5:2; catchSnd(); gameScore();
      it.el.style.transition='transform .25s,opacity .25s'; it.el.style.opacity='0';
      setTimeout(()=>it.el.remove(),260);
    }
    if(!it.done){ it.el.style.left=(it.x*100)+'%'; it.el.style.top=(it.y*100)+'%'; it.el.style.transform=`translate(-50%,-50%) rotate(${it.rot}deg)`; }
    if(it.y>1.1 && !it.done){ it.done=true; it.el.remove(); }
  }
  GM.items=GM.items.filter(i=>!i.done || i.el.isConnected);
  gameScore();
  if(GM.time<=0 && GM.items.every(i=>i.done)){ endGame(); return; }
  GM.raf=requestAnimationFrame(gameLoop);
}
function endGame(){
  GM.running=false;
  state.money+=GM.coins; save(); renderMoney(false); tada(); confetti();
  openSheet(`<div class="mpic buyPic">${petSvg(state.pet,state.wear)}</div><div class="mname">${t('gameEnd').replace('{n}',GM.caught)}</div>
    <div class="mq"><span class="spr big">${COIN}+${fmtMoney(GM.coins)}</span></div>
    <div class="row"><button class="pill ghost" data-gm="back">${t('back')}</button><button class="pill" data-gm="again">${t('again')}</button></div>`);
}
function leaveSub(from){ if(from==='park') goPark(); else goHome(); }
$('gameBack').addEventListener('click',()=>{ pop(); stopGame(); leaveSub(GM.from); });

/* --- Fotoalbum --- */
const CAM_SVG=`<svg viewBox="0 0 40 40"><rect x="4" y="11" width="32" height="22" rx="6" fill="#9b5cff"/><rect x="13" y="7" width="12" height="7" rx="2" fill="#9b5cff"/><circle cx="20" cy="22" r="7.5" fill="#fff"/><circle cx="20" cy="22" r="4.5" fill="#ff7ac0"/><circle cx="31" cy="16" r="1.8" fill="#ffd84d"/></svg>`;
const ALBUM_SVG=`<svg viewBox="0 0 40 40"><rect x="7" y="5" width="26" height="31" rx="4" fill="#ff7ac0"/><rect x="7" y="5" width="5" height="31" rx="2" fill="#e0306f"/><rect x="15" y="11" width="14" height="12" rx="2" fill="#fff"/>${heart(22,17.5,.55,'#ff4fa8')}</svg>`;
const GAME_SVG=`<svg viewBox="0 0 40 40"><path d="M10,12 H30 Q38,12 38,24 Q38,32 32,32 Q28,32 25,27 H15 Q12,32 8,32 Q2,32 2,24 Q2,12 10,12Z" fill="#7ad7ff"/><rect x="8" y="19" width="9" height="3" rx="1" fill="#fff"/><rect x="11" y="16" width="3" height="9" rx="1" fill="#fff"/><circle cx="28" cy="18" r="2.3" fill="#ff7ac0"/><circle cx="32" cy="23" r="2.3" fill="#ffd84d"/></svg>`;
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function photoSvg(ph){
  const bg = ph.pl==='park' ? ['#c8f7dc','#9ee6bd'] : ph.pl==='city' ? ['#e3d4ff','#c9a7ff'] : ['#ffd6ec','#ffb3dc'];
  const sky = ph.d ? `<rect x="8" y="8" width="104" height="96" rx="3" fill="#3b2a78"/><path d="M92,16 A9,9 0 1 0 101,27 A7,7 0 1 1 92,16Z" fill="#fff6b0"/>${star(22,20,2.5,'#fff')}${star(40,14,1.8,'#ffd84d')}${star(70,22,2,'#fff')}`
                   : `<rect x="8" y="8" width="104" height="96" rx="3" fill="${bg[0]}"/><circle cx="96" cy="22" r="7" fill="#ffd84d"/>${star(20,20,2.5,'#fff')}${heart(40,18,.5,'#ff7ac0')}`;
  const pet=petSvg(ph.p,ph.w).replace('<svg ','<svg x="10" y="24" width="100" height="78" ');
  const date=new Date(ph.ts).toLocaleDateString({de:'de-DE',ru:'ru-RU',ro:'ro-RO'}[lang]);
  return `<svg viewBox="0 0 120 142"><rect width="120" height="142" rx="6" fill="#fff"/>${sky}<rect x="8" y="80" width="104" height="24" fill="${ph.d?'#2a1d5a':bg[1]}"/>${pet}
    <text x="60" y="122" text-anchor="middle" font-size="11" font-weight="900" font-family="Arial,sans-serif" fill="#c2368a">${esc(ph.n)}</text>
    <text x="60" y="134" text-anchor="middle" font-size="7" font-weight="700" font-family="Arial,sans-serif" fill="#9b5cff">${date}</text></svg>`;
}
function takePhoto(place){
  if(!state.pet) return;
  if(state.photos.length>=40){ toast(t('albumFull')); nope(); return; }
  state.photos.push({p:{...state.pet}, w:{...state.wear}, n:state.name, pl:place, d:darkness(state.clock)>.5, ts:Date.now()});
  save(); shutter();
  const f=$('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),60);
  toast(t('photoSaved'));
}
let albumFrom='home';
function goAlbum(from){
  albumFrom=from||'home';
  const g=$('albumGrid');
  g.innerHTML = state.photos.length
    ? state.photos.map((ph,i)=>`<button class="photo" data-ph="${i}">${photoSvg(ph)}</button>`).reverse().join('')
    : `<div class="albumEmpty">${t('albumEmpty')}</div>`;
  show('s-album'); chime();
}
$('albumGrid').addEventListener('click',e=>{
  const b=e.target.closest('[data-ph]'); if(!b) return; pop();
  const i=+b.dataset.ph;
  openSheet(`<div class="bigPhoto">${photoSvg(state.photos[i])}</div>
    <div class="row" style="margin-top:2vmin"><button class="pill ghost" data-phdel="${i}">${t('del')}</button><button class="pill" data-close>${t('back')}</button></div>`);
});
$('albumBack').addEventListener('click',()=>{ pop(); leaveSub(albumFrom); });
$('sheet2').addEventListener('click',e=>{
  const d=e.target.closest('[data-phdel]');
  if(d){ state.photos.splice(+d.dataset.phdel,1); save(); closeSheet(); pop(); goAlbum(albumFrom); return; }
  const g=e.target.closest('[data-gm]');
  if(g){ closeSheet(); pop(); if(g.dataset.gm==='again') goGame(GM.from); else leaveSub(GM.from); }
});
document.querySelectorAll('.camBtn').forEach(b=>{ b.innerHTML=CAM_SVG; b.addEventListener('click',()=>takePhoto(b.dataset.cam)); });
document.querySelectorAll('.albumBtn').forEach(b=>{ b.innerHTML=ALBUM_SVG; b.addEventListener('click',()=>{ pop(); goAlbum(b.dataset.from); }); });
document.querySelectorAll('.gameBtn').forEach(b=>{ b.innerHTML=GAME_SVG; b.addEventListener('click',()=>{ if(current==='s-home' && HM.act) return; pop(); goGame(b.dataset.from); }); });
['vetBack','parkBack','gameBack','albumBack'].forEach(id=>$(id).innerHTML=BACK_ICON);
window.addEventListener('resize',()=>{ if(current==='s-park') fitPark(); });

/* ----- общие кнопки ----- */
document.querySelectorAll('[data-back]').forEach(b=>{
  b.innerHTML=BACK_ICON;
  b.addEventListener('click',()=>{ pop(); const to=b.dataset.back;
    if(to==='s-title') goTitle(); else if(to==='s-map') goMap();
    else { document.querySelectorAll('.av').forEach(x=>x.classList.remove('picked')); show(to); } });
});
$('nameBack').innerHTML=BACK_ICON;
$('homeBack').innerHTML=BACK_ICON;
$('shopBack').innerHTML=BACK_ICON;
$('cityBack').innerHTML=BACK_ICON;
$('btnPlay').addEventListener('click',()=>{ ac(); goFullscreen(); chime(); if(state.pet) goHome(); else show('s-avatar'); });
$('langs').addEventListener('click',e=>{ const b=e.target.closest('.lang'); if(!b) return; lang=b.dataset.lang; pop(); applyLang(); save(); });
function soundIcon(){ $('btnSound').innerHTML=muted?SOUND_OFF:SOUND_ON; }
$('btnSound').addEventListener('click',()=>{ muted=!muted; if(master) master.gain.value=muted?0:.8; soundIcon(); save(); if(!muted) pop(); });
$('btnFs').addEventListener('click',()=>{
  if(document.fullscreenElement||document.webkitFullscreenElement){ try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(e){} }
  else goFullscreen();
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>{ if(AC&&AC.state==='suspended') AC.resume(); },{passive:true});

/* ----- блёстки на фоне ----- */
(function(){
  const box=$('sparkles'), cols=['#fff','#ffd84d','#ff9fd2','#fff'];
  let h='';
  for(let i=0;i<22;i++){
    const sz=10+Math.random()*18;
    h+=`<div class="spk" style="left:${Math.random()*97}%;top:${Math.random()*95}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*2.6).toFixed(2)}s">
        <svg viewBox="0 0 20 20"><path d="M10,0 Q11,9 20,10 Q11,11 10,20 Q9,11 0,10 Q9,9 10,0Z" fill="${cols[i%4]}"/></svg></div>`;
  }
  box.innerHTML=h;
})();

/* ----- старт ----- */
load();
ensureItems();
$('dogHouse').innerHTML=dogHouseSvg();
$('catHouse').innerHTML=catHouseSvg();
$('homeHouse').innerHTML=homeSvg();
soundIcon();
applyLang();
goTitle();
// для проверки: index.html#dogs / #cats / #avatar / #map / #home / #homecat
const testPet=(type)=>{ if(!state.pet){ state.pet={type,i:type==='dog'?0:4}; state.name='Mimi'; } };
const DEBUG={'#dogs':goDogs,'#cats':goCats,'#avatar':()=>show('s-avatar'),'#map':goMap,
  '#home':()=>{ testPet('dog'); goHome(); },'#shop':()=>{ testPet('dog'); goShop('p'); },'#city':()=>{ testPet('dog'); goCity('home'); },'#park':()=>{ testPet('dog'); goPark(); },'#vet':()=>{ testPet('dog'); state.sick=true; goVet(); },'#game':()=>{ testPet('cat'); goGame('home'); },'#album':()=>{ testPet('dog'); goAlbum('home'); },'#shops':()=>{ testPet('dog'); goShop('s'); },'#homecat':()=>{ testPet('cat'); goHome(); }}[location.hash];
if(DEBUG) DEBUG();
// Offline-Modus (nur wenn das Spiel aus dem Internet geladen wird)
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
